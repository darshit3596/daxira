<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Outer Sweep Gradient -->
    <linearGradient id="daxiraOuterLg" x1="15%" y1="5%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#0058e6" />
      <stop offset="35%" stop-color="#0080ff" />
      <stop offset="70%" stop-color="#00c8ff" />
      <stop offset="100%" stop-color="#005ce6" />
    </linearGradient>

    <!-- Inner 3D Fold Shadow Gradient -->
    <linearGradient id="daxiraInnerLg" x1="5%" y1="5%" x2="95%" y2="95%">
      <stop offset="0%" stop-color="#03163b" />
      <stop offset="45%" stop-color="#062b70" />
      <stop offset="100%" stop-color="#0058e6" />
    </linearGradient>

    <!-- Pixel / Tech Block Gradient -->
    <linearGradient id="daxiraPixelLg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080ff" />
      <stop offset="100%" stop-color="#00d9ff" />
    </linearGradient>
    
    <!-- Dark Spine Gradient -->
    <linearGradient id="daxiraSpineLg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07235c" />
      <stop offset="100%" stop-color="#02112e" />
    </linearGradient>

    <!-- Cyan Accent for X -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
  </defs>

  <!-- Group: D Emblem -->
  <g transform="translate(70, 40) scale(1.8)">
    <!-- Digital Tech Pixel Cascade -->
    <rect x="18" y="18" width="12" height="12" rx="1.5" fill="#0058e6" />
    <rect x="34" y="26" width="13" height="13" rx="1.5" fill="#0084ff" />
    <rect x="19" y="42" width="13" height="13" rx="1.5" fill="#0066e0" />
    <rect x="37" y="48" width="14" height="14" rx="2" fill="url(#daxiraPixelLg)" />
    <rect x="52" y="32" width="14" height="14" rx="2" fill="url(#daxiraPixelLg)" />

    <!-- Lower Left Digital Spine Pillar -->
    <path d="M51 64 L74 88 L74 134 L51 134 Z" fill="url(#daxiraSpineLg)" />

    <!-- Inner 3D Shadow Fold of the D -->
    <path d="M53 14 C73 7 98 22 110 46 C97 51 84 66 74 88 L53 14 Z" fill="url(#daxiraInnerLg)" />

    <!-- Main Sweeping Outer D Ribbon -->
    <path d="M53 14 C80 6 128 32 130 80 C132 120 102 136 74 134 L74 116 C94 116 112 108 110 82 C108 58 84 40 68 38 L53 14 Z" fill="url(#daxiraOuterLg)" />

    <!-- Lower Inward Ribbon Crease -->
    <path d="M74 134 C98 134 126 120 124 82 C118 108 98 118 74 116 Z" fill="#0046b8" opacity="0.85" />
  </g>

  <!-- Wordmark "Daxira" -->
  <g transform="translate(250, 365)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="64" fill="#041b44" letter-spacing="-0.03em">
      Daxira
    </text>
    <!-- Cyan slash on letter 'x' -->
    <path d="M-34 -30 L-22 -14" stroke="#00b4d8" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Subtitle "InfoTech" -->
  <text x="250" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="25" fill="#041b44" letter-spacing="0.32em">
    INFOTECH
  </text>
</svg>
